name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pytest
        run: pip install pytest
      - name: Byte-compile the panel server
        run: python -m py_compile panel/server.py
      - name: Run tests
        run: pytest -q
      - name: Check frontend JS syntax
        run: |
          node --check panel/app.js
          node --check panel/sw.js
